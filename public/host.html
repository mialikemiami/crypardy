<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypardy · Host</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .cols { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .board-card { flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .main-card { flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 24px; }
  .side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .side .card { display: flex; flex-direction: column; gap: 12px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card-head .h { font-size: 26px; }
  .board { display: grid; gap: 6px; }
  .cat { min-height: 40px; display: flex; align-items: flex-end; font-size: 11px; line-height: 1.2; font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
  .cell { height: 44px; border: 0; border-radius: 8px; background: var(--blue); color: var(--white); font: 700 14px var(--body); display: flex; align-items: center; justify-content: center; gap: 5px; }
  button.cell { cursor: pointer; }
  .cell.used { background: transparent; border: 1.5px dashed var(--black); }
  .cell.live { background: var(--pink); }
  .cell.wager { box-shadow: 0 0 0 2px var(--cream), 0 0 0 4px var(--black); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .clue-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .clue-head .left { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .clue-text { font-size: 26px; line-height: 1.38; max-width: 46ch; }
  .response { font-family: var(--head); font-size: 44px; line-height: 1.05; color: var(--pink); overflow-wrap: anywhere; }
  .timer { display: flex; flex-direction: column; gap: 8px; }
  .timer-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 700; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; }
  .big-name { font-size: 44px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 2px solid var(--black); border-radius: 10px; }
  .list li.first, .list li.current { border-color: var(--pink); box-shadow: inset 0 0 0 1px var(--pink); }
  .list li.done { border-style: dashed; }
  .list .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .score-row { display: flex; align-items: center; gap: 12px; }
  .score-row .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .score-row .sub { font-size: 12px; }
  .score-row .score { font-size: 18px; font-weight: 700; }
  .avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--black); display: grid; place-items: center; font-weight: 700; }
  .icon-btn { flex: none; width: 44px; height: 44px; border: 2px solid var(--black); border-radius: 10px; background: var(--blue); color: var(--white); display: grid; place-items: center; cursor: pointer; }
  .lobby { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .lobby .card { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .people li { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .people .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .warnings { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  .winner { font-family: var(--head); font-size: 64px; color: var(--pink); line-height: 1; overflow-wrap: anywhere; }
  .final-response { font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .steps li { display: flex; align-items: flex-start; gap: 12px; line-height: 1.45; }
  .steps .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: var(--white); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .steps .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 3px; }
  .script { display: flex; align-items: flex-start; gap: 10px; }
  .script-text { flex: 1; min-width: 0; max-height: 9.5em; overflow: auto; padding: 8px 10px; border: 1.5px dashed var(--black); border-radius: 8px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .script .btn { flex: none; }
  .script-text .emote { display: inline-block; padding: 0 5px; border-radius: 6px; background: var(--pink); color: #fff; font-weight: 700; }
  .host-media img { display: block; max-width: 100%; max-height: 260px; border: 2px solid var(--black); border-radius: 10px; background: var(--black); object-fit: contain; }
  .host-media-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="js/host.js"></script>
</body>
</html>
